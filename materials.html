<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Materials — NPTEL Prep</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- TOP BRAND (Matching Mockup) -->
<header class="top-brand">
  <a href="index.html" class="top-brand-badge" title="MIC VIT Chennai — NPTEL Prep">
    <img src="mic-logo.webp" alt="MIC Logo" class="top-brand-logo">
    <span class="top-brand-text">MIC VIT CHENNAI</span>
  </a>
</header>

<div class="page-header">
  <div class="page-header-content">
    <h1><svg class="ui-icon page-title-icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg> Study Materials</h1>
    <p>Week-wise topics, key concepts, and curated reference resources</p>
  </div>
</div>

<main class="main-content">

  <!-- EXAM STUDY STRATEGY BANNER -->
  <div id="examStrategyContainer"></div>

  <!-- FILTER BAR -->
  <div class="filter-bar">
    <div class="search-input-wrapper">
      <span class="search-icon"><svg class="ui-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
      <input type="text" class="search-input" id="searchInput" placeholder="Search topics, resources…" autocomplete="off">
    </div>
    <select class="filter-select" id="weekFilter">
      <option value="">All Weeks</option>
    </select>
    <select class="filter-select" id="typeFilter">
      <option value="">All Resource Types</option>
      <option value="notes">Notes</option>
      <option value="video">Videos</option>
      <option value="reference">References</option>
    </select>
  </div>

  <!-- WEEK CARDS -->
  <div id="weekCards">
    <div class="empty-state">
      <div class="empty-state-icon"><svg class="ui-icon" viewBox="0 0 24 24" style="width:32px;height:32px"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></div>
      <h3>Loading materials…</h3>
    </div>
  </div>

  <div id="noResults" class="empty-state hidden">
    <div class="empty-state-icon"><svg class="ui-icon" viewBox="0 0 24 24" style="width:32px;height:32px"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></div>
    <h3>No results found</h3>
    <p>Try a different search term or clear the filters</p>
  </div>

</main>

<footer class="footer">
  <p>NPTEL Prep — Understanding Incubation and Entrepreneurship &nbsp;|&nbsp;
  <a href="https://nptel.ac.in" target="_blank" rel="noopener">nptel.ac.in</a></p>
</footer>

<div class="toast-container" id="toastContainer"></div>

<script src="js/app.js"></script>
<script src="js/materials.js"></script>

  <button class="bottom-nav-toggle" id="bottomNavToggle" onclick="toggleBottomMenu(event)" aria-label="Toggle navigation menu" aria-expanded="false">
    <span class="nav-stripe"></span>
    <span class="nav-stripe"></span>
    <span class="nav-stripe"></span>
  </button>
  <nav class="bottom-nav-menu" id="bottomNavMenu" aria-label="Navigation menu">

    <a href="materials.html" class="bottom-nav-link"><svg class="ui-icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg> Materials</a>
    <a href="quizzes.html" class="bottom-nav-link"><svg class="ui-icon" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg> Quizzes</a>
    <a href="mock-tests.html" class="bottom-nav-link"><svg class="ui-icon" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M9 14l2 2 4-4"></path></svg> Mock Tests</a>
  </nav>
</div>

</body>
</html>
